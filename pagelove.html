<!DOCTYPE html>
<html>
<head>
  <title>Kin — template manifest</title>
</head>
<body>
  <!--
    Template manifest. This is what describes the repository to the Pagelove
    console when it offers Kin as a template to install into an empty host. It
    is never installed: only the contents of site/ are copied, and they land at
    the host root.

    The console's template catalogue carries its own copy of these fields. This
    file is the repository's own statement of them, so a catalogue can be
    generated from it later rather than maintained by hand.
  -->
  <div itemscope itemtype="urn:console:Template">
    <meta itemprop="name" content="Kin">
    <meta itemprop="description" content="A personal CRM: keep track of conversations and know when to reconnect">
  </div>
</body>
</html>
